<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dictée → Actions</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1117;--surface:#1A1D27;--surface-2:#242836;--border:#2E3344;--text:#E8EAF0;--text-muted:#8B90A0;--accent:#6C5CE7;--accent-glow:rgba(108,92,231,0.25);--red:#FF6B6B;--red-glow:rgba(255,107,107,0.3);--green:#51CF66;--green-dim:rgba(81,207,102,0.15);--radius:14px;--font:'DM Sans',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace}*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}.header{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.header h1{font-size:18px;font-weight:700;letter-spacing:-0.3px}.header h1 span{color:var(--accent)}.mode-toggle{display:flex;background:var(--surface);border-radius:10px;padding:3px;gap:2px}.mode-btn{font-family:var(--font);font-size:12px;font-weight:600;padding:6px 14px;border:none;border-radius:8px;background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.2s}.mode-btn.active{background:var(--accent);color:#fff}.main{flex:1;display:flex;flex-direction:column;padding:16px 20px;gap:16px;overflow-y:auto}.transcript-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-height:100px;max-height:180px;overflow-y:auto;font-size:15px;line-height:1.55;color:var(--text-muted);position:relative}.transcript-box.has-text{color:var(--text)}.transcript-box .cursor{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:2px;vertical-align:text-bottom;animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}.listening-indicator{display:none;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--red)}.listening-indicator.active{display:flex}.listening-dot{width:8px;height:8px;background:var(--red);border-radius:50%;animation:pulse-dot 1.2s ease-in-out infinite}@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}.results{display:flex;flex-direction:column;gap:10px;flex:1}.result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;animation:slideUp 0.3s ease-out;position:relative}@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.result-card h3{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px}.task-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}.task-item:last-child{border-bottom:none}.task-checkbox{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;margin-top:1px}.task-checkbox.checked{background:var(--green);border-color:var(--green)}.task-checkbox.checked svg{opacity:1}.task-checkbox svg{opacity:0;transition:opacity 0.15s}.task-text{font-size:14px;line-height:1.5;flex:1}.task-text.done{text-decoration:line-through;color:var(--text-muted)}.memo-content{font-size:14px;line-height:1.65;white-space:pre-wrap}.memo-content strong{color:var(--accent);font-weight:600}.processing{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px;color:var(--text-muted);font-size:14px;font-weight:500}.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.controls{padding:12px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;border-top:1px solid var(--border);background:var(--bg)}.mic-btn{width:72px;height:72px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;box-shadow:0 4px 20px var(--accent-glow);position:relative}.mic-btn:active{transform:scale(0.93)}.mic-btn.recording{background:var(--red);box-shadow:0 4px 24px var(--red-glow);animation:pulse-ring 1.5s ease-out infinite}@keyframes pulse-ring{0%{box-shadow:0 0 0 0 var(--red-glow),0 4px 24px var(--red-glow)}70%{box-shadow:0 0 0 16px transparent,0 4px 24px var(--red-glow)}100%{box-shadow:0 0 0 0 transparent,0 4px 24px var(--red-glow)}}.mic-btn svg{width:28px;height:28px}.btn-row{display:flex;gap:10px;width:100%}.action-btn{flex:1;font-family:var(--font);font-size:14px;font-weight:600;padding:12px;border:none;border-radius:10px;cursor:pointer;transition:all 0.15s}.action-btn:active{transform:scale(0.97)}.btn-process{background:var(--accent);color:#fff}.btn-process:disabled{opacity:0.4;cursor:not-allowed}.btn-clear{background:var(--surface);color:var(--text-muted);border:1px solid var(--border)}.copy-btn{position:absolute;top:8px;right:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);border-radius:8px;padding:6px 10px;font-size:11px;font-family:var(--font);font-weight:600;cursor:pointer;transition:all 0.15s}.copy-btn:hover{color:var(--text);border-color:var(--accent)}.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--text-muted);gap:8px;padding:40px 20px;text-align:center}.empty-state svg{opacity:0.3;margin-bottom:4px}.empty-state p{font-size:14px;line-height:1.5}.empty-state .hint{font-size:12px;opacity:0.6}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}@media(max-width:400px){.mode-btn{padding:5px 10px;font-size:11px}.header h1{font-size:16px}}
</style>
</head>
<body>
<div class="header"><h1>Dictée <span>→</span> Actions</h1><div class="mode-toggle"><button class="mode-btn active" data-mode="tasks" onclick="setMode('tasks')">Tâches</button><button class="mode-btn" data-mode="memo" onclick="setMode('memo')">Mémo</button></div></div>
<div class="main" id="main"><div class="transcript-box" id="transcript">Appuie sur le micro et dicte tes notes…</div><div class="listening-indicator" id="listening"><div class="listening-dot"></div>Écoute en cours…</div><div class="results" id="results"><div class="empty-state" id="emptyState"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg><p>Dicte une note vocale,<br>elle sera transformée automatiquement.</p><span class="hint">Tâches = liste d'actions · Mémo = note structurée</span></div></div></div>
<div class="controls"><button class="mic-btn" id="micBtn" onclick="toggleRecording()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button><div class="btn-row"><button class="action-btn btn-clear" onclick="clearAll()">Effacer</button><button class="action-btn btn-process" id="processBtn" onclick="processText()" disabled>Transformer</button></div></div>
<script>
let mode='tasks',isRecording=false,recognition=null,rawText='',results=[];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)document.getElementById('transcript').textContent='⚠ Reconnaissance vocale non supportée. Utilise Chrome ou Safari.';
function setMode(m){mode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===m))}
function toggleRecording(){isRecording?stopRecording():startRecording()}
function startRecording(){if(!SR)return;recognition=new SR();recognition.lang='fr-FR';recognition.interimResults=true;recognition.continuous=true;recognition.maxAlternatives=1;let ft=rawText;recognition.onstart=()=>{isRecording=true;document.getElementById('micBtn').classList.add('recording');document.getElementById('listening').classList.add('active')};recognition.onresult=(e)=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal){ft+=(ft?' ':'')+t;rawText=ft}else interim=t}const d=ft+(interim?'<span style="opacity:0.4">'+interim+'</span>':'');const box=document.getElementById('transcript');box.innerHTML=d+'<span class="cursor"></span>';box.classList.add('has-text');document.getElementById('processBtn').disabled=!ft.trim();document.getElementById('emptyState').style.display='none'};recognition.onerror=(e)=>{console.error('Speech error',e.error);if(e.error==='not-allowed')document.getElementById('transcript').textContent='⚠ Autorise l\'accès au micro.';stopRecording()};recognition.onend=()=>{if(isRecording)try{recognition.start()}catch(e){stopRecording()}};try{recognition.start()}catch(e){console.error(e)}}
function stopRecording(){isRecording=false;if(recognition)try{recognition.stop()}catch(e){}recognition=null;document.getElementById('micBtn').classList.remove('recording');document.getElementById('listening').classList.remove('active')}
async function processText(){if(!rawText.trim())return;stopRecording();const pb=document.getElementById('processBtn');pb.disabled=true;const rd=document.getElementById('results');const pe=document.createElement('div');pe.className='processing';pe.innerHTML='<div class="spinner"></div>Traitement en cours…';rd.prepend(pe);const sp=mode==='tasks'?'Tu es un assistant qui transforme des notes dictées en liste de tâches claire et actionnable.\nRègles:\n- Extrais chaque action concrète identifiable\n- Reformule en phrases courtes et directes à l\'impératif ou infinitif\n- Si une tâche a un contexte important (deadline, personne, lieu), inclus-le entre parenthèses\n- Numérote les tâches\n- Réponds UNIQUEMENT en JSON : {"tasks": ["tâche 1", "tâche 2", ...]}':'Tu es un assistant qui transforme des notes dictées en mémo structuré et professionnel.\nRègles:\n- Génère un titre court et percutant\n- Structure le contenu en paragraphes clairs\n- Utilise **gras** pour les points clés\n- Corrige la grammaire et les hésitations de l\'oral\n- Garde le sens et les détails importants\n- Réponds UNIQUEMENT en JSON : {"title": "...", "content": "..."}';try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:sp,messages:[{role:"user",content:rawText}]})});const data=await r.json();const txt=data.content?.map(c=>c.text||'').join('')||'';const cl=txt.replace(/```json|```/g,'').trim();const parsed=JSON.parse(cl);pe.remove();renderResult(parsed);rawText='';document.getElementById('transcript').innerHTML='Appuie sur le micro pour une nouvelle note…';document.getElementById('transcript').classList.remove('has-text')}catch(err){console.error('API error:',err);pe.innerHTML='⚠ Erreur de traitement. Réessaie.';setTimeout(()=>pe.remove(),3000)}pb.disabled=false}
function renderResult(data){const rd=document.getElementById('results');document.getElementById('emptyState').style.display='none';const card=document.createElement('div');card.className='result-card';if(data.tasks){card.innerHTML='<h3>✓ Tâches extraites</h3><button class="copy-btn" onclick="copyCard(this)">Copier</button><div class="task-list">'+data.tasks.map(t=>'<div class="task-item"><div class="task-checkbox" onclick="toggleTask(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><span class="task-text">'+escapeHtml(t)+'</span></div>').join('')+'</div>'}else if(data.title){const fmt=data.content.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');card.innerHTML='<h3>📝 '+escapeHtml(data.title)+'</h3><button class="copy-btn" onclick="copyCard(this)">Copier</button><div class="memo-content">'+fmt+'</div>'}rd.prepend(card)}
function toggleTask(el){el.classList.toggle('checked');el.nextElementSibling.classList.toggle('done')}
function copyCard(btn){const card=btn.closest('.result-card');const tt=card.querySelectorAll('.task-text');const mc=card.querySelector('.memo-content');let text='';if(tt.length){text=Array.from(tt).map(t=>{const c=t.previousElementSibling.classList.contains('checked');return(c?'✓':'☐')+' '+t.textContent}).join('\n')}else if(mc){text=card.querySelector('h3').textContent.replace('📝 ','')+'\n\n'+mc.textContent}navigator.clipboard.writeText(text).then(()=>{btn.textContent='Copié ✓';setTimeout(()=>btn.textContent='Copier',1500)})}
function clearAll(){rawText='';stopRecording();document.getElementById('transcript').innerHTML='Appuie sur le micro et dicte tes notes…';document.getElementById('transcript').classList.remove('has-text');document.getElementById('processBtn').disabled=true;document.getElementById('results').innerHTML='<div class="empty-state" id="emptyState"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg><p>Dicte une note vocale,<br>elle sera transformée automatiquement.</p><span class="hint">Tâches = liste d\'actions · Mémo = note structurée</span></div>'}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
</script>
</body>
</html>
